services:
  - type: web
    name: wearless-node-test
    runtime: docker
    plan: free
    dockerfilePath: node/gateway/userspace/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEARLESS_NODE_KEY
        value: wearless-test-key-2026
      - key: WEARLESS_ALLOWED_HOSTS
        value: "example.com,api.github.com,cloudflare.com,raw.githubusercontent.com"